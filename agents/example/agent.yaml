name: example_agent
model: openai/gpt-4o-mini
system_prompt: prompts/system.md
tools:
  - current_time
  - final_answer
  - web_search
  - schedule_task
  - filesystem
allowed_tool_risk_levels:
  - safe
  - read_only
  - write
skills:
  - concise_operator
  - web_research
guardrails:
  - default
max_iterations: 8
temperature: 0.2
metadata:
