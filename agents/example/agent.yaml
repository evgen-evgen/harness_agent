  - console
cache: local_json
memory: local_jsonl
memory_top_k: 5
memory_max_chars: 2000
session: local_json
session_history_limit: 10
context_max_chars: 24000
context_memory_max_chars: 6000
context_session_max_chars: 8000
scheduler: local_json
